name: a11y

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contrast-check:
    name: Tertiary text contrast (WCAG AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:contrast
