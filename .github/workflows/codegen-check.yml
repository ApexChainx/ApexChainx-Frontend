name: API Type Sync Check

on:
  pull_request:
    paths:
      - "src/types/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "src/types/**"
      - "package.json"

jobs:
  codegen-check:
    name: Verify generated types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Check if backend OpenAPI spec is reachable
        id: spec-check
        run: |
          if curl -sf "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}/../openapi.json" > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend OpenAPI spec not reachable — skipping codegen drift check"
          fi
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Run codegen and check for drift
        if: steps.spec-check.outputs.available == 'true'
        run: |
          cp src/types/api.generated.ts src/types/api.generated.ts.bak
          npm run codegen
          if ! diff -q src/types/api.generated.ts src/types/api.generated.ts.bak > /dev/null 2>&1; then
            echo "::error::Generated types are out of date. Run 'npm run codegen' and commit the updated file."
            diff src/types/api.generated.ts.bak src/types/api.generated.ts || true
            exit 1
          fi
          echo "Generated types are up to date."
